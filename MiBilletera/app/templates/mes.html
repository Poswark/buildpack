
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiBilletera | Control Financiero Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary-color: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --secondary-color: #8b5cf6;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --header-bg: #1e293b;
            --hover-bg: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent-color: #ec4899;
            --accent-gradient: linear-gradient(135deg, #ec4899, #fb7185);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #3b82f6;
            --glass-bg: rgba(30, 41, 59, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            --card-radius: 20px;
            --input-radius: 12px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 35%, rgba(99, 102, 241, 0.15) 0%, transparent 50%), 
                radial-gradient(circle at 75% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            transition: all 0.3s ease;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 25px;
        }
        
        /* Glass Card Styling */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 28px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .card-header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--glass-border);
            border-radius: var(--card-radius) var(--card-radius) 0 0 !important;
            padding: 22px 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-header-left {
            display: flex;
            align-items: center;
        }
        
        .card-header i {
            font-size: 1.5rem;
            margin-right: 15px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .card-header .card-actions {
            display: flex;
            gap: 12px;
        }
        
        .card-action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .card-action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            transform: scale(1.1);
        }
        
        .card-body {
            padding: 30px;
        }
        
        /* Chart Container */
        .chart-container {
            position: relative;
            height: 380px;
            margin: 15px auto 25px;
            padding: 10px;
        }
        
        /* Modern Navigation */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 0;
        }
        
        .app-logo {
            font-size: 28px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        
        .app-logo i {
            font-size: 24px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 10px;
        }
        
        .navbar {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 8px;
            margin-bottom: 35px;
            box-shadow: var(--box-shadow);
            position: sticky;
            top: 20px;
            z-index: 1000;
        }
        
        .navbar-nav {
            display: flex;
            width: 100%;
            justify-content: space-around;
        }
        
        .nav-item {
            position: relative;
        }
        
        .nav-link {
            color: var(--text-secondary) !important;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 100px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-link.active {
            background: var(--primary-gradient);
            color: white !important;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }
        
        .nav-link:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary) !important;
        }
        
        .nav-link i {
            font-size: 18px;
        }
        
        /* Month Navigation */
        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 12px 25px;
            box-shadow: var(--box-shadow);
        }
        
        .month-nav h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .month-nav-button {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
            border: none;
        }
        
        .month-nav-button:hover {
            transform: scale(1.15);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5);
            color: white;
        }
        
        /* Category Items */
        .category-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 16px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .category-item:hover {
            background: var(--hover-bg);
            transform: translateX(5px);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            margin-right: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .category-name {
            flex-grow: 1;
            font-size: 1.05em;
            font-weight: 500;
        }
        
        .category-amount {
            font-weight: 700;
            font-size: 1.15em;
            color: var(--text-primary);
            padding: 5px 15px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 100px;
        }
        
        .total-row {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 25px;
            padding-top: 25px;
            font-weight: 700;
            font-size: 1.2em;
        }
        
        .total-row div:last-child {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.2em;
        }
        
        /* Form Elements */
        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--input-radius);
            color: var(--text-primary);
            padding: 14px 18px;
            transition: all 0.3s ease;
            font-size: 15px;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            color: var(--text-primary);
        }
        
        .form-select option {
            background-color: var(--card-bg);
            color: var(--text-primary);
        }
        
        .form-label {
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 15px;
        }
        
        ::placeholder {
            color: rgba(255, 255, 255, 0.3) !important;
        }
        
        /* Buttons */
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            border-radius: 100px;
            padding: 14px 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.5);
        }
        
        .btn-primary:hover::after {
            transform: translateX(100%);
        }
        
        .btn-outline-light {
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            background: transparent;
            border-radius: 100px;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }
        
        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: var(--text-primary);
        }
        
        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: var(--box-shadow);
        }
        
        .stat-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            font-size: 24px;
        }
        
        .stat-icon.income {
            color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
        }
        
        .stat-icon.expense {
            color: var(--danger-color);
            background: rgba(239, 68, 68, 0.1);
        }
        
        .stat-icon.savings {
            color: var(--info-color);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .stat-icon.budget {
            color: var(--warning-color);
            background: rgba(245, 158, 11, 0.1);
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
        }
        
        /* Animation */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
            100% {
                transform: translateY(0px);
            }
        }
        
        .floating {
            animation: float 5s ease-in-out infinite;
        }
        
        /* Page Title */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        .page-title {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }
        
        .page-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--accent-gradient);
            border-radius: 100px;
        }
        
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Responsive */
        @media (max-width: 992px) {
            .navbar-nav {
                justify-content: flex-start;
                overflow-x: auto;
                padding: 5px;
            }
            
            .nav-link {
                white-space: nowrap;
            }
            
            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .card-header .card-actions {
                margin-top: 15px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .page-title {
                font-size: 32px;
            }
            
            .month-nav h2 {
                font-size: 22px;
            }
            
            .card-body {
                padding: 20px;
            }
            
            .navbar {
                margin-bottom: 25px;
            }
        }
        
        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .bg-bubble {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(to bottom right, rgba(99, 102, 241, 0.05), rgba(236, 72, 153, 0.05));
            animation: float-bubble 25s linear infinite;
            opacity: 0.6;
        }
        
        .bg-bubble:nth-child(1) {
            width: 300px;
            height: 300px;
            left: 5%;
            top: 15%;
            animation-duration: 45s;
        }
        
        .bg-bubble:nth-child(2) {
            width: 400px;
            height: 400px;
            right: 10%;
            top: 30%;
            animation-duration: 40s;
            animation-delay: 5s;
        }
        
        .bg-bubble:nth-child(3) {
            width: 200px;
            height: 200px;
            left: 30%;
            bottom: 20%;
            animation-duration: 50s;
            animation-delay: 10s;
        }
        
        .bg-bubble:nth-child(4) {
            width: 350px;
            height: 350px;
            right: 30%;
            bottom: 5%;
            animation-duration: 55s;
            animation-delay: 15s;
        }
        
        @keyframes float-bubble {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20vh) rotate(180deg);
            }
            100% {
                transform: translateY(0) rotate(360deg);
            }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-gradient);
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-bubble"></div>
        <div class="bg-bubble"></div>
        <div class="bg-bubble"></div>
        <div class="bg-bubble"></div>
    </div>
    
    <div class="container">
        <!-- App Header -->
        <div class="app-header">
            <div class="app-logo">
                <i class="fas fa-wallet"></i> MiBilletera
            </div>
            <div class="user-dropdown">
                <button class="btn btn-outline-light">
                    <i class="fas fa-user-circle me-2"></i>
                    <span>Mi Cuenta</span>
                </button>
            </div>
        </div>
        
        <!-- Navbar Mejorada -->
        <nav class="navbar navbar-expand">
            <div class="container-fluid">
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" href="/">
                                <i class="fas fa-home"></i>
                                <span>Inicio</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/mes">
                                <i class="fas fa-calendar-alt"></i>
                                <span>Mes</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="fas fa-chart-line"></i>
                                <span>Dian</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/reporte">
                                <i class="fas fa-file-alt"></i>
                                <span>Reporte</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/contacto">
                                <i class="fas fa-circle-user"></i>
                                <span>Perfil</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/logout">
                                <i class="fas fa-sign-out-alt"></i>
                                <span>Salir</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Monthly Expenses Overview</h1>
        
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Total Monthly Expenses</h5>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const monthlyData = {{ monthly_data|tojson }};
        
        const labels = Object.keys(monthlyData);
        const data = Object.values(monthlyData);
        
        const ctx = document.getElementById('monthlyChart').getContext('2d');
        const monthlyChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Expenses',
                    data: data,
                    backgroundColor: 'rgba(59, 130, 246, 0.5)',
                    borderColor: '#3bf655',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
